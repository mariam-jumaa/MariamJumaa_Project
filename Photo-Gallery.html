<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photo Gallery</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      background:#eef1f8;
      margin:0;
      font-family:Arial, sans-serif;
      text-align:center;
    }
 
    /* Navbar */
    nav {
      padding:10px;
      background-color:rgb(230,230,250);
      box-shadow:1px 1px 5px rgb(188,188,188);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      position:relative;
    }
 
    nav .title {
      font-size:20px;
      font-weight:bold;
      color:rgb(89,179,209);
      position:absolute;
      left:15px;
    }
 
    nav ul {
      list-style:none;
      display:flex;
      gap:20px;
      margin:0;
      padding:0;
      flex-wrap:wrap;
      justify-content:center;
    }
 
    nav ul li a {
      text-decoration:none;
      color:#233648;
      font-size:15px;
    }
 
    nav ul li a.Game {
      background:#2fc839;
      border-radius:115px;
      color:#fff;
      padding:5px 10px;
    }
 
    nav ul li a:hover {
      background:rgb(161,200,241);
      color:#fff;
      border-radius:8px;
      padding:0 7px;
      transition:0.3s;
    }
 
    /* Titles */
    h1.title { margin-top:30px; font-size:32px; color:#1f2e55; }
    .subtitle { color:#777; margin-top:-10px; }
 
    /* Auto-Rotation Dropdown */
    .filter-box {
      background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      border-radius:10px;
      display:inline-block;
      margin-top:15px;
      padding:10px 15px;
    }
    label { font-weight:bold; color:#1f2e55; margin-right:8px; }
    select {
      padding:6px 10px;
      border-radius:6px;
      font-size:14px;
      border:1px solid #ccc;
    }
 
    /* Slider */
    .slider-container {
      position:relative;
      width:90%;
      max-width:900px;
      margin:30px auto;
      background:#fff;
      border-radius:18px;
      box-shadow:0 5px 15px rgba(0,0,0,0.15);
      overflow:hidden;
    }
    .slide img {
      width:100%;
      height:450px;
      object-fit:cover;
      border-radius:18px;
      transition:opacity 0.6s ease;
    }
 
    /* Arrows */
    .arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:#fff;
      border-radius:50%;
      width:40px;
      height:40px;
      cursor:pointer;
      box-shadow:0 5px 10px rgba(0,0,0,0.1);
      font-size:20px;
    }
    .arrow.left { left:20px; }
    .arrow.right { right:20px; }
    .arrow:hover { background:#f1f3f9; }
 
    /* Dots */
    .dots { margin:15px 0; }
    .dot {
      display:inline-block;
      width:10px;
      height:10px;
      background:#9bb6e8;
      border-radius:50%;
      margin:0 4px;
      opacity:0.4;
      transition:0.3s;
    }
    .dot.active { opacity:1; background:#5a8fe0; }
 
    /* Footer */
    .footer { color:#5b6da4; margin:25px 0; font-size:14px; }
 
    /* Responsive */
    @media (max-width:768px){
      .slide img { height:300px; }
      .arrow { width:35px; height:35px; font-size:18px; }
    }
    @media (max-width:480px){
      .slide img { height:220px; }
      h1.title { font-size:24px; }
      .arrow { width:30px; height:30px; font-size:16px; }
    }
  </style>
</head>
 
<body>
  <nav>
    <div class="title">Student Portfolio</div>
    <ul>
      <li><a href="Index.html">Home</a></li>
      <li><a href="Skills.html">Skills</a></li>
      <li><a href="Projects.html">Projects</a></li>
      <li><a href="Photo-Gallery.html" class="active">Photo Gallery</a></li>
      <li><a href="Contact-Us.html">Contact Us</a></li>
      <li><a href="Game.html" class="Game">Play Game</a></li>
    </ul>
  </nav>
 
  <h1 class="title">Photo Gallery</h1>
  <p class="subtitle">Swipe/Click arrows to see images</p>
 
  <!-- ✅ Auto-Rotation Control -->
  <div class="filter-box">
    <label for="autoRotate">Auto-rotation:</label>
    <select id="autoRotate">
      <option value="0">Off</option>
      <option value="1000">1s</option>
      <option value="2000">2s</option>
      <option value="3000">3s</option>
    </select>
  </div>
 
  <div class="slider-container">
    <button class="arrow left" onclick="prevSlide()">❮</button>
 
    <div class="slide">
      <img id="galleryImg" src="img1.jpg" alt="Gallery Photo">
    </div>
 
    <button class="arrow right" onclick="nextSlide()">❯</button>
  </div>
 
  <div class="dots" id="dotsContainer"></div>
 
  <div class="footer">
    © 2025 • ATS Schools • WEB Technology Course • Made with HTML, CSS & JS
  </div>
 
  <script>
    const images = [
      { url:"img1.jpg" },
      { url:"img2.jpg" },
      { url:"img3.jpg" },
    ];
 
    let current = 0;
    let img = document.getElementById('galleryImg');
    let dotsContainer = document.getElementById('dotsContainer');
    let interval = null;
 
    function createDots() {
      dotsContainer.innerHTML = "";
      images.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => { current = i; showSlide(); });
        dotsContainer.appendChild(dot);
      });
    }
 
    function showSlide() {
      img.style.opacity = 0;
      setTimeout(() => {
        img.src = images[current].url;
        img.style.opacity = 1;
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }, 200);
    }
 
    function nextSlide() {
      current = (current + 1) % images.length;
      showSlide();
    }
 
    function prevSlide() {
      current = (current - 1 + images.length) % images.length;
      showSlide();
    }
 
    // ✅ Auto-rotation change
    document.getElementById("autoRotate").addEventListener("change", function() {
      clearInterval(interval);
      const speed = parseInt(this.value);
      if (speed > 0) {
        interval = setInterval(nextSlide, speed);
      }
    });
 
    // Initialize
    createDots();
    showSlide();
  </script>
</body>
</html>
