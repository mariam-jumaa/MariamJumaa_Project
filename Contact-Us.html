<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        background-color: rgb(234, 234, 245);
    }
    nav {
        padding: 10px;
        background-color: rgb(230, 230, 270);
        box-shadow: 1px 1px 5px rgb(188, 188, 188);
        width: 100%;
        justify-content: space-between;
        align-items: center;
        display: flex;
    }
 
    nav .title {
        font-size: 20px;
        font-weight: bold;
        color: rgb(89, 179, 209);
        margin-right: 20px;
    }
 
    ul {
        list-style-type: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 1px;
        overflow: hidden;
        justify-content: center;
    }
 
    nav ul li {
        display: flex;
        float: left;
        margin-right: 20px;
        justify-content: center;
    }
 
    nav ul li a {
        text-decoration: none;
        color: rgb(33, 54, 72);
        font-size: 15px;
    }
 
    nav ul li a.Game {
        background: #2fc839;    
        border-radius: 115px;
        color: aliceblue;
        padding: 5px 10px;
    }
 
    nav ul li a:hover {
        color: rgb(186, 174, 210);
        background-color: rgb(161, 200, 241);
        border-radius: 8px;
        padding: 0px 7px;
        color: aliceblue;
        transition: 0.3s;
    }
 
    nav a.active {
        background: #f8cdcd;    
        border-radius: 6px;
        color: aliceblue;
    }
    div.footer {
        grid-area: footer;
        text-align: center;
        padding-bottom: 0px;
        color: rgb(91, 109, 164);
        background-color: rgb(234, 234, 245);
        box-shadow: none;
    }
    form {
        background-color: rgb(255, 255, 255);
        padding: 10px;
        border-radius: 10px;
        width: 95%;
        box-shadow: 1px 1px 5px rgb(188, 188, 188);
        margin: auto;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
 
    input[type="radio"], input[type="checkbox"] {
      margin-left: 275px;
    }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 2px solid rgb(186, 174, 210);
      border-radius: 4px;
    }
    input[type="submit"] {
      background-color: rgb(10, 164, 215);
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      margin-right: 10px;
    }
    input[type="reset"] {
      background-color: rgb(230, 230, 270);
      color: rgb(33, 54, 72);
      padding: 10px 15px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      margin-right: 10px;
    }
    input[type="submit"], input[type="reset"]:hover {
      background-color: rgb(17, 86, 147);
      transition: 0.3s;
    }
 
     @media (max-width: 768px) {
            .box{
                width: 45%;
            }
        }
 
        @media (max-width: 480px) {
            .box{
                width: 90%;
                display: block;
                margin: 10px auto;
            }
        }
    </style>
</head>
<body>
 <nav>
  <ul>
     <div class="title">Student Portfolio</div>
     <div>
         <li><a href="Index.html">Home</a></li>
         <li><a href="Skills.html">Skills</a></li>
         <li><a href="Projects.html">Projects</a></li>
         <li><a href="Photo-Gallery.html">Photo Gallery</a></li>
         <li><a href="Contact-Us.html">Contact us</a></li>
         <li><a href="Game.html" class="Game">Play Game</a></li>
     </div>
  </ul>
    </nav>
 
    <h1>Contact Us</h1>
    <div class="contact_us">
        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
            <p>At least three characters</p>
           
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br><br>
 
            <label for="topic">Topic</label>
            <select id="country"name="country">
              <option value=""disabled selected> Choose..</option>
              <option value="option1"> 1</option>
              <option value="option2"> 2</option>
              <option value="option3"> 3</option>
           </select>
           <br>
           <br>
           <fieldset>
             <legend>Preferred Contact Method</legend>
             <br>
             <input type="radio" name="choice" value="email">
             <label for="email">Email</label>
             <br>
             <input type="radio" name="choice" value="phone">
             <label for="phone">Phone</label>
           </fieldset>
           <br>
 
            <fieldset>
             <legend>Interest</legend>
             <br>
             <input type="checkbox" name="web" value="web">
             <label for="web">Web</label>
             <br>
             <input type="checkbox" name="games" value="games">
             <label for="games">Games</label>
             <br>
             <input type="checkbox" name="all" value="all">
             <label for="all">All</label>
           </fieldset>
           <br>
 
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
 
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </div>
 
    <div class="footer"><hp>2025 • ATS Schools • WEB Technology Course •
         Made with HTML, CSS, and JS</p></div>
</body>
</html>
